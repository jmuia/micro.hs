name: Check compiled Lua

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Lua
        run: sudo apt-get update && sudo apt-get install -y lua5.4

      - name: Install Fennel
        run: |
          curl -LO https://fennel-lang.org/downloads/fennel-1.5.1
          chmod +x fennel-1.5.1
          sudo mv fennel-1.5.1 /usr/local/bin/fennel

      - name: Verify compiled Lua is up to date
        run: make check
